<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>UI Designs</title>

  <!-- Fonts -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;700;900&family=Barlow:wght@400;500;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;700;900&family=Barlow:wght@400;500;700&display=swap">
  </noscript>

  <!-- Styles and Scripts -->
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js"></script>

</head>

<body style="background-color: var(--white);">  

<main>

<div id="header-placeholder"></div>

<section style="padding: 2rem; display: flex; flex-direction: column; justify-content: center; align-items: center; justify-items: center;">
  
  <div class="wp-post" style="margin: 2rem auto;">

    <h1 class="post-title">
      Selenium.Dev Website Homepage Redesign
    </h1>


    <div class="post-meta">
      <div class="post-meta-text">
        <p>Designed 2025</p>
        <p>Technology Sector</p>
        <p onclick="window.open('/assets/images/uiwork/selenium website original.webp', '_blank')" style="cursor: pointer; text-decoration: underline;">
            View Current/Existing/Original Image
        </p>
      </div>
    </div>

    <div class="phot-item">

      <div style="overflow: hidden;">
        <img src="/assets/images/uiwork/UI-1-thumb.webp" onclick="window.open('/assets/images/uiwork/UI-1-full.png', '_blank')"
        style="width: 100%; height: 100%; object-fit: cover; display: block; cursor: pointer;" />
      </div>

    </div>

  </div>

  <div class="wp-post" style="margin: 2rem auto; border-top: 2px solid var(--black-200); padding-top: 2rem;">

    <h1 class="post-title">
      HDFC Netbanking App Redesign
    </h1>


    <div class="post-meta">
      <div class="post-meta-text">
        <p>Designed 2025</p>
        <p>Banking/Fintech Sector</p>

      </div>
    </div>        
    
    
    <h5>
        Current Screens
    </h5>

    <div class="facts-grid-flat">

        <img src="/assets/images/hdfc/Funds.webp" onclick="window.open(this.src, '_blank')" style="cursor: pointer;"/>
        <img src="/assets/images/hdfc/before-bene-list.png" onclick="window.open(this.src, '_blank')" style="cursor: pointer;"/>
        <img src="/assets/images/hdfc/Cards.webp" onclick="window.open(this.src, '_blank')" style="cursor: pointer;"/>

    </div>

    <h5>
        Redesigned Screens
    </h5>
    
    <div class="facts-grid-flat">

        <img src="/assets/images/uiwork/HDFC-2.webp" onclick="window.open(this.src, '_blank')" style="cursor: pointer;"/>
        <img src="/assets/images/uiwork/HDFC-3.webp" onclick="window.open(this.src, '_blank')" style="cursor: pointer;"/>
        <img src="/assets/images/uiwork/HDFC-4.webp" onclick="window.open(this.src, '_blank')" style="cursor: pointer;"/>

    </div>

  </div>

  <div class="wp-post" style="margin: 2rem auto; border-top: 2px solid var(--black-200); padding-top: 2rem;">

    <h1 class="post-title">
      LLM for Research [AI Chat] Design
    </h1>


    <div class="post-meta">
      <div class="post-meta-text">
        <p>Designed 2025</p>
        <p>AI/LLM Sector</p>
      </div>
    </div>        
    
    <div class="facts-grid-flat">

        <img src="/assets/images/uiwork/AIChatDashboard-1.webp" onclick="window.open(this.src, '_blank')" style="cursor: pointer;"/>
        <img src="/assets/images/uiwork/AIChatDashboard-2.webp" onclick="window.open(this.src, '_blank')" style="cursor: pointer;"/>

    </div>

  </div>    
    
</section>

</main>

<div id="footer-placeholder"></div>

<script>
  // Fetch and insert footer HTML
  fetch('/addons/footer.html')
    .then(response => response.text())
    .then(data => {
      document.getElementById('footer-placeholder').innerHTML = data;
    })
    .catch(error => console.error("Error loading footer:", error));
</script>

<script>
fetch('/addons/header.html') .then(response => response.text()) .then(data => { document.getElementById('header-placeholder').innerHTML = data; }) .catch(error => console.error("Error loading header:", error));
</script>
