<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/script.js"></script>
    <style>
      body {
        background: var(--karthik-bg-page-dark);
        color: var(--karthik-text-on-dark);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 24px;
      }

      <a href="/index.html" class="karthik-btn karthik-btn--primary"

      >
    </div>
