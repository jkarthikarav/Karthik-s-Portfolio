<script>
const karthikApMarquee = document.querySelector(
  ".karthik-ap-marquee-content",
);
if (karthikApMarquee) {
  karthikApMarquee.addEventListener("mouseenter", () => {
    karthikApMarquee.style.animationPlayState = "paused";
  });
  karthikApMarquee.addEventListener("mouseleave", () => {
    karthikApMarquee.style.animationPlayState = "running";
  });
}
</script>

<script>
(function () {
  const follower = document.getElementById("karthik-ap-follower");
  const items = document.querySelectorAll(".karthik-ap-item");

  // Mouse reactive background + magnetic hover
  document.addEventListener("mousemove", (e) => {
    const x = e.clientX;
    const y = e.clientY;

    follower.style.left = x + "px";
    follower.style.top = y + "px";

    items.forEach((item) => {
      const rect = item.getBoundingClientRect();
      const content = item.querySelector(".karthik-ap-item-content");

      const isHovering =
        x >= rect.left &&
        x <= rect.right &&
        y >= rect.top &&
        y <= rect.bottom;

      if (isHovering) {
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        const deltaX = (x - centerX) * 0.15;
        const deltaY = (y - centerY) * 0.3;

        content.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
        item.style.borderColor = "#1A1A1A";
      } else {
        content.style.transform = "translate(0, 0)";
        item.style.borderColor = "";
      }
    });
  });

  // Entrance animation
  window.addEventListener("DOMContentLoaded", () => {
    items.forEach((item, index) => {
      item.style.opacity = "0";
      item.style.transform = "translateY(20px)";
      item.style.transition =
        "opacity 0.6s ease, transform 0.6s cubic-bezier(0.16, 1, 0.3, 1)";

      setTimeout(() => {
        item.style.opacity = "1";
        item.style.transform = "translateY(0)";
      }, 100 * index);
    });
  });

  items.forEach((item) => {
    item.addEventListener("click", () => {
      const url = item.getAttribute("data-url");
      if (url) window.location.href = url;
    });
  });

  // Reset transform on mouse leave per item
  items.forEach((item) => {
    item.addEventListener("mouseleave", () => {
      const content = item.querySelector(".karthik-ap-item-content");
      content.style.transform = "translate(0, -10)";
    });
  });
})();
</script>
