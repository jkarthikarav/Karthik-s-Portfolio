<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Test Page</title>

	<!-- Fonts -->
	<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Karla:wght@400;700&family=Rubik:wght@500;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
	<noscript>
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karla:wght@400;700&family=Rubik:wght@500;700&display=swap">
	</noscript>

	<!-- Stylesheet -->
	<link rel="stylesheet" href="style.css">

	<!-- Script -->
	<script src="script.js" defer></script>
</head>

<body style="background-color: var(--white);">

	<!-- Header Placeholder -->
	<div id="header-placeholder"></div>


<div id="footer-placeholder"></div>

<script>
  // Fetch and insert footer HTML
  fetch('footer.html')
    .then(response => response.text())
    .then(data => {
      document.getElementById('footer-placeholder').innerHTML = data;
    })
    .catch(error => console.error("Error loading footer:", error));
</script>

<script>
  // Fetch and insert header HTML
  fetch('header.html')
    .then(response => response.text())
    .then(data => {
      document.getElementById('header-placeholder').innerHTML = data;
    })
    .catch(error => console.error("Error loading header:", error));
</script>

</body>
</html>
