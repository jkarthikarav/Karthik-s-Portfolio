# .github/workflows/update-sitemap.yml
name: Update Sitemap

on:
  push:
    branches: [ main ]  # Change if your default branch is not main

permissions:
  contents: write  # Grants push permission

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for git push to work

      - name: Update sitemap.xml <lastmod> date
        run: |
          DATE=$(date +"%Y-%m-%d")
          sed -i "s#<lastmod>.*</lastmod>#<lastmod>${DATE}</lastmod>#g" sitemap.xml

      - name: Commit and push sitemap.xml update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          if git diff --cached --quiet; then
            echo "✅ No changes to commit"
          else
            git commit -m "Auto-update sitemap lastmod to ${DATE}"
            git push
          fi
